name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  compile-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies（CI 用 CPU 版 torch：云端无显卡，CUDA 版会白拖 NVIDIA 全家桶）
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Syntax check (py_compile 全后端)
        run: |
          python -m compileall backend -q

      - name: 单元测试（纯函数层，无 key/无网络/秒级）
        working-directory: backend
        run: |
          pip install pytest -q
          python -m pytest tests

      - name: 重建知识库向量索引（CI 环境无数据目录，评测前先建库；模型从 HF 官方源下载）
        working-directory: backend
        env:
          HF_ENDPOINT: https://huggingface.co   # 覆盖代码里的国内镜像 setdefault（境外机器直连更快）
        run: |
          python scripts/init_knowledge_base.py

      - name: 检索评测（L1 层，skip-llm，CPU）
        working-directory: backend
        env:
          ZHIPU_API_KEY: ""        # 评测 --skip-llm 不需要真实 key（v3.15 起 import 不再强校验）
          HF_ENDPOINT: https://huggingface.co
        run: |
          python scripts/evaluate_rag.py --mode hybrid --skip-llm

      - name: 拒答与召回守护（对照基线 70.6%）
        run: |
          python - <<'PY'
          import glob, re, sys
          reports = sorted(glob.glob("backend/eval/reports/report_hybrid_*.md"))
          assert reports, "未找到评测报告"
          text = open(reports[-1], encoding="utf-8").read()
          m = re.search(r"Hit@5:\s*(\d+)/(\d+)", text)
          hit, total = int(m.group(1)), int(m.group(2))
          ratio = hit / total
          print(f"Hit@5 = {hit}/{total} = {ratio:.1%}")
          # 基线 70.6%（2026-09-18 实测，口径见 docs 对外数字口径表）；
          # 知识库变更会移动该数字：跌破基线 5 个百分点即拦截合并。
          assert ratio >= 0.656, f"Hit@5 {ratio:.1%} 低于守护线 65.6%（基线 70.6% - 5pp）"
          PY
